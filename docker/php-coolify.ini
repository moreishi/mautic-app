; Coolify production PHP defaults for Mautic 7 (merged via conf.d)
; Matches official docker-mautic ENV defaults
date.timezone = UTC
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
max_input_vars = 5000
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.assertions = -1
